<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szukamy Dzieciątka – gra 8-bit</title>
<meta name="theme-color" content="#0a0a14">
<style>
    :root { --gold:#f5c542; --paper:#f5e8c0; --muted:#b8a880; --edge:#6a5a3a; --panel:#12122a; --panel2:#1c1c3a; --brand:#e63946; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background: radial-gradient(ellipse at 50% 0%, #1c1c3c 0%, #0a0a14 70%); color:var(--paper);
           font-family:'Courier New', Courier, monospace; padding:16px; display:flex; justify-content:center; }
    .game-wrap { width:100%; max-width:760px; }
    h1 { margin:4px 0 12px; text-align:center; font-size:clamp(1.15rem,3.6vw,1.6rem); color:var(--gold); letter-spacing:.04em; text-shadow:2px 2px 0 #000; }
    .frame { background:#0c0c1c; border:4px solid var(--edge); border-radius:14px; padding:8px; box-shadow:0 0 0 3px #000, 0 12px 40px rgba(0,0,0,.6); }
    canvas { display:block; width:100%; aspect-ratio:8/5; border-radius:6px; background:#000;
             image-rendering:crisp-edges; image-rendering:pixelated; }
    .dialog { margin-top:12px; background:var(--panel); border:3px solid var(--edge); border-radius:10px; padding:12px 16px; text-align:center; }
    .dialog .title { font-weight:700; font-size:clamp(1.05rem,3.2vw,1.3rem); color:var(--paper); margin-bottom:4px; }
    .dialog .hint { color:var(--muted); font-size:clamp(.9rem,2.6vw,1rem); min-height:3.2em; line-height:1.5; }
    .options { display:grid; gap:8px; margin-top:12px; }
    .opt { font:inherit; font-weight:700; font-size:1rem; text-align:left; color:var(--paper); background:var(--panel2); border:3px solid var(--edge);
           border-radius:10px; padding:12px 16px; min-height:50px; cursor:pointer; transition:transform .08s, border-color .08s, background .08s; }
    .opt:hover:not(:disabled), .opt:focus-visible { border-color:var(--gold); background:#2a2a50; color:#fff; outline:none; transform:translateX(3px); }
    .opt:disabled { opacity:.55; cursor:default; }
    .endbox { margin-top:12px; text-align:center; background:var(--panel); border:3px solid var(--edge); border-radius:10px; padding:18px 14px; }
    .end-title { font-size:clamp(1.4rem,5vw,2rem); font-weight:700; margin-bottom:6px; }
    .end-title.win { color:var(--gold); text-shadow:2px 2px 0 #000; }
    .end-title.lose { color:#ff7a7a; text-shadow:2px 2px 0 #000; }
    .end-info { color:var(--muted); margin-bottom:14px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
    .btn { font:inherit; font-weight:700; color:#fff; background:var(--brand); border:3px solid #000; border-radius:10px; padding:11px 20px; cursor:pointer; text-decoration:none; display:inline-block; }
    .btn:hover { filter:brightness(1.12); }
    .btn.alt { background:var(--panel2); border-color:var(--edge); color:var(--paper); }
    .btn:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
    .bar { margin-top:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .bar .btn { padding:9px 16px; font-size:.9rem; }
    .stat { color:var(--gold); font-weight:700; }
    .legend { margin-top:12px; text-align:center; color:#6e6a58; font-size:.82rem; }
    .back { display:block; text-align:center; margin:14px 0 4px; color:var(--muted); }
    .frame { position:relative; }
    .hud { display:flex; justify-content:space-between; align-items:center; padding:2px 4px 8px; }
    .heart { display:inline-block; font-size:1.35rem; margin-right:3px; transition:transform .2s; }
    .heart.lost { opacity:.55; }
    .heart.hit { animation:hit .5s; }
    @keyframes hit { 0%{transform:scale(1.9);} 100%{transform:scale(1);} }
    .slots { display:flex; gap:6px; }
    .slot { display:grid; place-items:center; width:38px; height:34px; border:2px dashed #4a4a6a; border-radius:8px; color:#6a6a8a; font-size:1.2rem; }
    .slot.have { border:2px solid var(--gold); background:#2a2438; color:#fff; box-shadow:0 0 10px rgba(245,197,66,.35); }
    .toast { position:absolute; left:50%; top:60px; transform:translate(-50%,-10px); background:rgba(10,10,20,.92); color:var(--gold); border:2px solid var(--gold);
             padding:8px 16px; border-radius:10px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; white-space:nowrap; max-width:94%; overflow:hidden; text-overflow:ellipsis; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .frame.shake { animation:shake .38s; }
    @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(4px);} }
    .opt.locked { opacity:.5; border-style:dashed; font-weight:400; }
    .opt.wrongpick { opacity:.45; border-color:#a03a3a; text-decoration:line-through; }
    .end-stars { font-size:2rem; letter-spacing:.2em; margin-bottom:6px; }
    .end-badges { color:var(--gold); font-weight:700; margin:-6px 0 14px; }
    .badges { margin-top:10px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
    .badge { background:var(--panel); border:2px solid #2a2a44; border-radius:10px; padding:10px; text-align:center; opacity:.65; font-size:.88rem; }
    .badge.got { opacity:1; border-color:var(--gold); }
    .badge .bi { display:block; font-size:1.6rem; }
    .badge small { display:block; color:var(--muted); margin-top:3px; }
    .chap { font-size:.72rem; letter-spacing:.14em; color:#8a7aa8; margin-bottom:4px; }
    .say { margin-top:12px; background:#f5e8c0; color:#2a1c10; border-radius:12px; padding:10px 14px; text-align:left; position:relative; font-weight:700; line-height:1.45; box-shadow:0 3px 0 #8a7a50; }
    .say::before { content:''; position:absolute; top:-9px; left:28px; border:9px solid transparent; border-bottom-color:#f5e8c0; border-top:0; }
    .say .who { display:block; font-size:.78rem; color:#8a5a2a; letter-spacing:.05em; margin-bottom:2px; }
    .say.pop { animation:pop .3s; }
    @keyframes pop { 0%{transform:scale(.92);opacity:0;} 100%{transform:scale(1);opacity:1;} }
    .btn.cont { background:#2a7a4a; }
    [hidden] { display:none !important; }
    @media (max-width:520px){ body{padding:10px;} .bar{justify-content:center;} }
</style>
</head>
<body>
<div class="game-wrap">
    <h1>⭐ SZUKAMY DZIECIĄTKA ⭐</h1>
    <div class="frame" id="frame">
        <div class="hud"><div class="hearts" id="hearts"></div><div class="slots" id="slots"></div></div>
        <canvas id="scene" width="320" height="200" role="img" aria-label="Ilustracja bieżącej sceny gry"></canvas>
        <div class="toast" id="toast" role="status"></div>
    </div>

    <div class="dialog" aria-live="polite">
        <div class="chap" id="chap"></div>
        <div class="title" id="title"></div>
        <div class="hint" id="hint"></div>
        <div class="say" id="say" hidden><span class="who" id="sayWho"></span><span class="txt" id="sayText"></span></div>
    </div>
    <div class="options" id="options"></div>
    <div class="endbox" id="endbox" hidden>
        <div class="end-title" id="endTitle"></div>
        <div class="end-stars" id="endStars"></div>
        <div class="end-info" id="endInfo"></div>
        <div class="end-badges" id="endBadges"></div>
        <div class="actions">
            <button class="btn cont" id="cont" type="button" hidden></button>
            <button class="btn" id="again" type="button">🔄 Zagraj jeszcze raz</button>
            <a class="btn alt" href="index.html#games">🎮 Wróć do gier</a>
        </div>
    </div>

    <div class="bar">
        <button class="btn alt" id="restart" type="button">🔄 NOWA GRA</button>
        <span class="stat">👣 Kroki: <span id="steps">0</span></span>
        <button class="btn alt" id="badgesBtn" type="button" aria-expanded="false">🏅 Odznaki</button>
        <button class="btn alt" id="sound" type="button" aria-pressed="false">🔇 Dźwięk</button>
    </div>
    <div class="badges" id="badges" hidden></div>
    <div class="legend">❤️ Masz 3 serca – błędna odpowiedź lub zły wybór kosztuje serce.<br>🕯️ 🍞 🎁 📜 Zbieraj przedmioty, bo pomogą w drodze i dadzą więcej gwiazdek.<br>↑ ↓ wybór · ENTER zatwierdź · klawisze 1–9 · albo dotknij odpowiedzi</div>
    <a class="back" href="index.html#games">← Wróć do gier</a>
</div>

let T = 0, sceneT = 0;

function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function at(x, y, s, fn) {
    const a = Array.prototype.slice.call(arguments, 4);

    fn.apply(null, [0, 0].concat(a)); ctx.restore();
}

}
function band(colors, y0, y1) {

}
function stars(t, count, maxY, dim) {

        ctx.fillRect(x, y, big, big);
    }
}

}
function house(x, base, w, h, col, roof, t, seed) {

    if (LOSE.has(scene)) vignette();

    if (trans) drawDissolve(trans.phase === 'out' ? trans.p : 1 - trans.p);
}
const COLS = 20, ROWS = 13, order = [];
for (let i = 0; i < COLS * ROWS; i++) order.push(Math.random());
function drawDissolve(p) {
    ctx.fillStyle = '#000';
    for (let i = 0; i < order.length; i++) if (order[i] < p) ctx.fillRect((i % COLS) * 16, Math.floor(i / COLS) * 16, 16, 16);
}

/* ======================= UI / LOGIKA ======================= */
const $ = id => document.getElementById(id);
const titleEl = $('title'), hintEl = $('hint'), optionsEl = $('options'), endEl = $('endbox');
let hintText = '', typed = 0, busy = false, trans = null, kbd = false, pendingCount = false, pendingReset = false;
let hearts = MAXH, curOpts = [];
const items = new Set(), flags = new Set();
let earned = new Set();
try { earned = new Set(JSON.parse(localStorage.getItem('leo-gabi-gra-odznaki') || '[]')); } catch (e) {}
const ENDBADGE = { stajnia: 'end_stajnia', stajnia_z_pasterzami: 'end_pasterze', medrcy_stajnia: 'end_medrcy', swiatynia_koniec: 'swiatynia', nazaret: 'nazaret' };
const CH2 = new Set(['swiatynia', 'swiatynia_ofiara', 'swiatynia_symeon', 'swiatynia_anna', 'gate_swiatynia', 'swiatynia_koniec']);
const CH3 = new Set(['sen_medrcow', 'sen_jozefa', 'ucieczka_egipt', 'pustynia_glod', 'smierc_heroda', 'droga_nazaret', 'gate_nazaret', 'nazaret', 'egipt_koniec']);
function chapterOf(id) { return CH2.has(id) ? 'ROZDZIAŁ II · ŚWIĄTYNIA W JEROZOLIMIE' : CH3.has(id) ? 'ROZDZIAŁ III · EGIPT I NAZARET' : 'ROZDZIAŁ I · BETLEJEM'; }

/* ---------- dźwięk ---------- */
let soundOn = false, actx = null;
function beep(f, d, delay, type, vol) {
    if (!soundOn) return;
    try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + (delay || 0);
        o.type = type || 'square'; o.frequency.value = f;
        g.gain.setValueAtTime(vol || 0.05, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
        o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + d);
    } catch (e) {}
}
function sfx(kind) {
    if (kind === 'pick') { beep(660, 0.07); beep(880, 0.07, 0.07); }
    else if (kind === 'win') [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.18, i * 0.14));
    else if (kind === 'lose') [392, 330, 262].forEach((f, i) => beep(f, 0.22, i * 0.18, 'triangle', 0.07));
    else if (kind === 'hurt') { beep(220, 0.12, 0, 'sawtooth', 0.06); beep(165, 0.18, 0.1, 'sawtooth', 0.06); }
    else if (kind === 'item') [784, 988, 1175].forEach((f, i) => beep(f, 0.1, i * 0.08));
}
$('sound').addEventListener('click', function () {
    soundOn = !soundOn; this.textContent = (soundOn ? '🔊' : '🔇') + ' Dźwięk'; this.setAttribute('aria-pressed', soundOn);
    if (soundOn) beep(660, 0.1);
});

/* ---------- HUD, powiadomienia, odznaki ---------- */
function updateHUD(hit) {
    let h = '';
    for (let i = 0; i < MAXH; i++) h += '<span class="heart' + (i < hearts ? '' : ' lost') + (hit && i === hearts ? ' hit' : '') + '">' + (i < hearts ? '❤️' : '🖤') + '</span>';
    $('hearts').innerHTML = h;
    $('hearts').setAttribute('aria-label', 'Serca: ' + hearts + ' z ' + MAXH);
    $('slots').innerHTML = Object.keys(ITEMS).map(k =>
        '<span class="slot' + (items.has(k) ? ' have' : '') + '" title="' + ITEMS[k].name + '">' + (items.has(k) ? ITEMS[k].icon : '·') + '</span>').join('');
}
let toastT = 0;
function notify(msg) {
    const el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400);
}
function shake() {
    if (reduce) return;
    const f = $('frame'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
}
function renderBadges() {
    const keys = Object.keys(BADGES);
    $('badgesBtn').textContent = '🏅 Odznaki ' + keys.filter(k => earned.has(k)).length + '/' + keys.length;
    $('badges').innerHTML = keys.map(k =>
        '<div class="badge' + (earned.has(k) ? ' got' : '') + '"><span class="bi">' + (earned.has(k) ? BADGES[k][0] : '🔒') + '</span><b>' + BADGES[k][1] + '</b><small>' + BADGES[k][2] + '</small></div>').join('');
}
$('badgesBtn').addEventListener('click', function () {
    const el = $('badges'); el.hidden = !el.hidden; this.setAttribute('aria-expanded', String(!el.hidden));
});
function awardBadges(id) {
    const got = [];
    const add = b => { if (!earned.has(b)) { earned.add(b); got.push(b); } };
    if (ENDBADGE[id]) add(ENDBADGE[id]);
    if (hearts === MAXH) add('bez_strat');
    if (items.size === Object.keys(ITEMS).length) add('pelna_sakwa');
    if (items.has('zwoj')) add('znawca');
    if (flags.has('egipt')) add('egipt');
    if (flags.has('prawda')) add('prawda');
    try { localStorage.setItem('leo-gabi-gra-odznaki', JSON.stringify(Array.from(earned))); } catch (e) {}
    renderBadges();
    return got;
}

/* ---------- interfejs sceny ---------- */
function setBusy(b) {
    optionsEl.querySelectorAll('button').forEach(x => { x.disabled = b || x.dataset.locked === '1'; });
}
function visibleOptions(sc) {
    let o = sc.options.filter(x => !(x.hideIf && items.has(x.hideIf)));
    if (sc.shuffle) o = o.slice().sort(() => Math.random() - 0.5);
    return o;
}
function lockInfo(o) {
    if (o._elim) return ' — zwój podpowiada: to nie to';
    if (o.requires && !items.has(o.requires)) { const it = ITEMS[o.requires]; return ' — potrzebna: ' + it.icon + ' ' + it.name; }
    if (o.requiresFlags && !o.requiresFlags.every(f => flags.has(f))) return o.lockText || ' — jeszcze nie teraz';
    return '';
}
function setUI(id) {
    const sc = game[id];
    $('chap').textContent = chapterOf(id);
    titleEl.textContent = sc.text;
    hintText = '> ' + sc.hint + ' <'; typed = reduce ? 999 : 0; hintEl.textContent = reduce ? hintText : '';
    const sayEl = $('say');
    if (sc.say) {
        sayEl.hidden = false; $('sayWho').textContent = sc.say.who; $('sayText').textContent = sc.say.text;
        sayEl.classList.remove('pop'); void sayEl.offsetWidth; sayEl.classList.add('pop');
    } else sayEl.hidden = true;
    optionsEl.innerHTML = ''; endEl.hidden = true;
    if (sc.mini) { optionsEl.hidden = true; mgStart(sc.mini); return; }
    if (sc.options.length) {
        optionsEl.hidden = false;
        curOpts = visibleOptions(sc);
        curOpts.forEach(o => { o._elim = false; });
        if (sc.shuffle && items.has('zwoj')) { const w = curOpts.find(o => o.wrong); if (w) w._elim = true; }
        curOpts.forEach(o => {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'opt';
            const lk = lockInfo(o);
            if (lk) { b.textContent = o.text + lk; b.dataset.locked = '1'; b.classList.add('locked'); b.disabled = true; }
            else { b.textContent = o.text; b.addEventListener('click', () => choose(o, b)); }
            optionsEl.appendChild(b);
        });
        setBusy(busy);
    } else {
        optionsEl.hidden = true;
        const win = WIN.has(id);
        endEl.hidden = false;
        $('endTitle').textContent = win ? '★ ZWYCIĘSTWO! ★' : '✖ PRZEGRANA ✖';
        $('endTitle').className = 'end-title ' + (win ? 'win' : 'lose');
        let info = 'Kroki: ' + steps + ' · Serca: ' + hearts + '/' + MAXH + ' · Przedmioty: ' + items.size + '/' + Object.keys(ITEMS).length;
        const contBtn = $('cont');
        if (sc.cont) { contBtn.hidden = false; contBtn.textContent = sc.cont.text; contBtn.onclick = () => goTo(sc.cont.next, true, false); }
        else { contBtn.hidden = true; contBtn.onclick = null; }
        if (win) {
            const stars = 1 + (hearts === MAXH ? 1 : 0) + (items.size >= 2 ? 1 : 0);
            $('endStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
            const fresh = awardBadges(id);
            $('endBadges').textContent = fresh.length ? 'Nowa odznaka: ' + fresh.map(b => BADGES[b][0] + ' ' + BADGES[b][1]).join(', ') : '';
            info += ' — brawo!';
            for (let i = 0; i < 45; i++) spawnSpark(true);
        } else {
            $('endStars').textContent = ''; $('endBadges').textContent = '';
            info += ' — spróbuj jeszcze raz, na pewno się uda!';
        }
        $('endInfo').textContent = info;
        sfx(win ? 'win' : 'lose');
    }
}
function applyScene(id) {
    mgStop();
    scene = id; sceneT = 0; parts.length = 0;
    if (pendingReset) { steps = 0; hearts = MAXH; items.clear(); flags.clear(); }
    else if (pendingCount) steps++;
    let sc = game[id], hit = false;
    if (sc.penalty) {
        hearts = Math.max(0, hearts - sc.penalty); hit = true;
        notify('−' + sc.penalty + ' ❤️  Tracisz serce'); sfx('hurt'); shake();
    }
    if (hearts <= 0 && id !== 'koniec_serc') { scene = id = 'koniec_serc'; sc = game[id]; }
    if (sc.gives && !items.has(sc.gives)) {
        items.add(sc.gives);
        const it = ITEMS[sc.gives];
        notify('Zdobyłeś: ' + it.icon + ' ' + it.name); sfx('item');
    }
    if (sc.flag) flags.add(sc.flag);
    $('steps').textContent = steps;
    updateHUD(hit);
    setUI(id);
}
function goTo(id, count, reset) {
    if (busy || !game[id]) return;
    busy = true; pendingCount = !!count; pendingReset = !!reset;
    setBusy(true); sfx('pick');
    if (reduce) { applyScene(id); busy = false; setBusy(false); return; }
    trans = { phase: 'out', p: 0, next: id };
}
function choose(o, b) {
    if (busy) return;
    if (o.wrong) {
        hearts = Math.max(0, hearts - 1); updateHUD(true);
        notify('Nie tak! −1 ❤️'); sfx('hurt'); shake();
        b.classList.add('wrongpick'); b.dataset.locked = '1'; b.disabled = true;
        if (hearts <= 0) { goTo('koniec_serc', false, false); }
        else { hintText = '> Nie tak! Spróbuj jeszcze raz. <'; typed = 999; hintEl.textContent = hintText; }
        return;
    }
    let next = o.next;
    if (o.nextIf) next = items.has(o.nextIf.item) ? o.nextIf.yes : o.nextIf.no;
    goTo(next, true, false);
}
$('restart').addEventListener('click', () => goTo('start', false, true));
$('again').addEventListener('click', () => goTo('start', false, true));

/* ---------- sterowanie minigrą ---------- */
canvas.addEventListener('pointerdown', e => { if (mg.on) { const r = canvas.getBoundingClientRect(); mg.tx = (e.clientX - r.left) / r.width * W; } });
canvas.addEventListener('pointermove', e => { if (mg.on) { const r = canvas.getBoundingClientRect(); mg.tx = (e.clientX - r.left) / r.width * W; } });
document.addEventListener('keyup', e => { if ((e.key === 'ArrowLeft' && mg.key === -1) || (e.key === 'ArrowRight' && mg.key === 1)) mg.key = 0; });

document.addEventListener('keydown', function (e) {
    if (mg.on) { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); mg.key = e.key === 'ArrowLeft' ? -1 : 1; } return; }
    if (busy) return;
    const opts = Array.prototype.slice.call(optionsEl.querySelectorAll('.opt'));
    if (/^[1-9]$/.test(e.key)) { const o = opts[+e.key - 1]; if (o) { e.preventDefault(); kbd = true; o.click(); } return; }
    if (!opts.length) return;
    const idx = opts.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); kbd = true; opts[(idx + 1) % opts.length].focus({ preventScroll: true }); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); kbd = true; opts[(idx <= 0 ? opts.length : idx) - 1].focus({ preventScroll: true }); }
    else if (e.key === 'Enter' && idx === -1) { e.preventDefault(); kbd = true; opts[0].focus({ preventScroll: true }); }
});

let acc = 0;
function update(dt) {
    mgUpdate(dt);
    if (typed < hintText.length) { typed += dt * 55; hintEl.textContent = hintText.slice(0, Math.floor(typed)); }
    if (WIN.has(scene) && !trans) { acc += dt * 18; while (acc > 1 && parts.length < 90) { spawnSpark(false); acc -= 1; } acc = Math.min(acc, 1); }
    for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life > p.max) parts.splice(i, 1); }
    if (trans) {
        trans.p += dt / 0.32;
        if (trans.p >= 1) {
            if (trans.phase === 'out') { applyScene(trans.next); trans = { phase: 'in', p: 0 }; }
            else { trans = null; busy = false; setBusy(false); if (kbd) { const f = optionsEl.querySelector('.opt'); if (f) f.focus({ preventScroll: true }); } }
        }
    }
}
let last = performance.now();
function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    T += dt; sceneT += dt; update(dt); render();
    requestAnimationFrame(loop);
}
trans = { phase: 'in', p: 0 }; busy = true;
updateHUD(); renderBadges();
setUI('start');
requestAnimationFrame(function (n) { last = n; loop(n); });
})();
</script>
</body>
